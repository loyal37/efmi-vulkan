; The original as the judge: a command that cannot act does nothing, and what follows it runs, in the same
; Present and in every later one (docs/architecture-review-2.1.md, P0-4). `clear = Resource depth` asks for
; a depth-stencil view (ClearViewCommand::create_best_view), which D3D11 makes of no buffer: nothing is
; cleared and the list goes on. The layer's owned runtime raised an exception there, which ended every
; later Present's owned work of the generation.
namespace = judge
[Constants]
global $frames = 0
global persist $kept = -1
global persist $after = -1
global persist $later = -1
global persist $mark = 0
[ResourceScratch]
type = RWBuffer
format = R32_FLOAT
data = 5 6 7 8
[ResourceFirst]
type = Buffer
format = R32_FLOAT
data = 1 1 1 1
[ResourceSecond]
type = Buffer
format = R32_FLOAT
data = 9 9 9 9
[ResourceOut]
[Present]
if $frames == 3
    clear = ResourceScratch depth
    store = $after, ResourceFirst, 0
endif
store = $kept, ResourceScratch, 1
if $frames < 6
    ResourceOut = copy ResourceFirst
else
    ResourceOut = copy ResourceSecond
endif
store = $later, ResourceOut, 0
if $frames < 100
    $frames = $frames + 1
endif
$mark = 1
