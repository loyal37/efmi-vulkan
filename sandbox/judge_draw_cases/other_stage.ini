; A binding at another stage's slot that the list leaves changed: the original binds it and draws on (the
; scene's vertex shader reads no constant buffer).
namespace = judge
[Constants]
global persist $mark = 0
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourcePlaceD]
type = Buffer
stride = 8
filename = place_d.buf
[ResourceIndexFirst]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_first.buf
[ResourceIndexSecond]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_second.buf
[ResourceRed]
filename = red.dds
[ResourceGreen]
filename = green.dds
[ResourceBlue]
filename = blue.dds
[ResourceConstants]
type = Buffer
format = R32_FLOAT
data = 1 2 3 4
[TextureOverrideFirst]
hash = HASH_A
match_index_count = 6
handling = skip
vs-cb1 = ResourceConstants
vb0 = ResourcePlaceC
ps-t0 = ResourceRed
drawindexed = 6, 0, 0
[Present]
$mark = 1
