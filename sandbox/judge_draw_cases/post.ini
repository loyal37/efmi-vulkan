; Commands after the game's draw: the game's second quad with the Mod's texture, then the Mod's quad
; elsewhere with what is bound by then.
namespace = judge
[Constants]
global persist $mark = 0
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourcePlaceD]
type = Buffer
stride = 8
filename = place_d.buf
[ResourceIndexFirst]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_first.buf
[ResourceIndexSecond]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_second.buf
[ResourceRed]
filename = red.dds
[ResourceGreen]
filename = green.dds
[ResourceBlue]
filename = blue.dds
[TextureOverrideSecond]
hash = HASH_B
match_index_count = 6
ps-t0 = ResourceBlue
post vb0 = ResourcePlaceD
post drawindexed = 6, 0, 0
[Present]
$mark = 1
