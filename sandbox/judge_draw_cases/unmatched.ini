; Sections whose draw keys do not fit the draw do not run.
namespace = judge
[Constants]
global persist $mark = 0
global persist $five = 0
global persist $offset = 0
global persist $exact = 0
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourcePlaceD]
type = Buffer
stride = 8
filename = place_d.buf
[ResourceIndexFirst]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_first.buf
[ResourceIndexSecond]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_second.buf
[ResourceRed]
filename = red.dds
[ResourceGreen]
filename = green.dds
[ResourceBlue]
filename = blue.dds
[TextureOverrideFive]
hash = HASH_A
match_index_count = 5
$five = 1
[TextureOverrideOffset]
hash = HASH_A
match_index_count = 6
match_first_index = 3
$offset = 1
[TextureOverrideExact]
hash = HASH_A
match_index_count = 6
match_first_index = 0
$exact = 1
[Present]
$mark = 1
