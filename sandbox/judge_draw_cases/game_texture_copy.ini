; A copy of the game's texture taken before the list binds its own, bound back for a second draw: the
; first triangle of place C has the Mod's texture, the second the game's again (the draw state, D-161:
; "the application's binding of slot S" is a value a declaration holds for the lists of its draw).
namespace = judge
[Constants]
global persist $mark = 0
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourcePlaceD]
type = Buffer
stride = 8
filename = place_d.buf
[ResourceIndexFirst]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_first.buf
[ResourceIndexSecond]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_second.buf
[ResourceRed]
filename = red.dds
[ResourceGreen]
filename = green.dds
[ResourceBlue]
filename = blue.dds
[ResourceSaved]
[TextureOverrideFirst]
hash = HASH_A
match_index_count = 6
handling = skip
ResourceSaved = copy ps-t0
vb0 = ResourcePlaceC
ib = ResourceIndexFirst
ps-t0 = ResourceGreen
drawindexed = 3, 0, 0
ps-t0 = ResourceSaved
drawindexed = 3, 3, 0
[Present]
$mark = 1
