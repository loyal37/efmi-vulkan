; A copy between the Mod's own resources inside a draw's list, bound afterwards.
namespace = judge
[Constants]
global persist $mark = 0
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourcePlaceD]
type = Buffer
stride = 8
filename = place_d.buf
[ResourceIndexFirst]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_first.buf
[ResourceIndexSecond]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_second.buf
[ResourceRed]
filename = red.dds
[ResourceGreen]
filename = green.dds
[ResourceBlue]
filename = blue.dds
[ResourceCopied]
[TextureOverrideFirst]
hash = HASH_A
match_index_count = 6
handling = skip
ResourceCopied = copy ResourcePlaceC
vb0 = ResourceCopied
ps-t0 = ResourceGreen
drawindexed = 6, 0, 0
[Present]
$mark = 1
