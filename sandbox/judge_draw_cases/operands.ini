; What a list reads of the draw that matched.
namespace = judge
[Constants]
global persist $mark = 0
global persist $count = -1
global persist $first = -1
global persist $type = -1
global persist $instances = -1
global persist $vertices = -1
global persist $base = -1
global persist $first_instance = -1
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourcePlaceD]
type = Buffer
stride = 8
filename = place_d.buf
[ResourceIndexFirst]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_first.buf
[ResourceIndexSecond]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_second.buf
[ResourceRed]
filename = red.dds
[ResourceGreen]
filename = green.dds
[ResourceBlue]
filename = blue.dds
[TextureOverrideSecond]
hash = HASH_B
match_index_count = 6
$count = index_count
$first = first_index
$type = draw_type
$instances = instance_count
$vertices = vertex_count
$base = first_vertex
$first_instance = first_instance
[Present]
$mark = 1
