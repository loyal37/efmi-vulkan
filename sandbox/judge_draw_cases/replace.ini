; A replaced mesh: the game's first draw is hidden and the Mod's quad drawn at another place with its
; own index buffer and texture.
namespace = judge
[Constants]
global persist $mark = 0
global persist $matched = 0
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourcePlaceD]
type = Buffer
stride = 8
filename = place_d.buf
[ResourceIndexFirst]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_first.buf
[ResourceIndexSecond]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_second.buf
[ResourceRed]
filename = red.dds
[ResourceGreen]
filename = green.dds
[ResourceBlue]
filename = blue.dds
[TextureOverrideFirst]
hash = HASH_A
match_index_count = 6
handling = skip
vb0 = ResourcePlaceC
ib = ResourceIndexFirst
ps-t0 = ResourceRed
drawindexed = 6, 0, 0
$matched = 1
[Present]
$mark = 1
