; Two sections on one hash: the order the original runs them in (match_priority, then the name).
namespace = judge
[Constants]
global persist $mark = 0
global persist $sequence = 0
global $step = 0
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourcePlaceD]
type = Buffer
stride = 8
filename = place_d.buf
[ResourceIndexFirst]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_first.buf
[ResourceIndexSecond]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_second.buf
[ResourceRed]
filename = red.dds
[ResourceGreen]
filename = green.dds
[ResourceBlue]
filename = blue.dds
[TextureOverrideOne]
hash = HASH_A
match_index_count = 6
match_priority = 1
$step = $step * 10 + 1
[TextureOverrideTwo]
hash = HASH_A
match_index_count = 6
match_priority = 0
$step = $step * 10 + 2
[TextureOverrideThree]
hash = HASH_A
match_index_count = 6
match_priority = 0
$step = $step * 10 + 3
[Present]
if $step > 0
    $sequence = $step
endif
$step = 0
$mark = 1
