; `handling = skip` in the post phase comes after the game's draw: the draw is drawn (the original's
; context reads the flag between its pre and post lists only).
namespace = judge
[Constants]
global persist $mark = 0
global persist $ran = 0
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourcePlaceD]
type = Buffer
stride = 8
filename = place_d.buf
[ResourceIndexFirst]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_first.buf
[ResourceIndexSecond]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = indices_second.buf
[ResourceRed]
filename = red.dds
[ResourceGreen]
filename = green.dds
[ResourceBlue]
filename = blue.dds
[TextureOverrideFirst]
hash = HASH_A
match_index_count = 6
post handling = skip
post $ran = 1
[Present]
$mark = 1
