; What a list reads of the textures at the pixel slots and of its own (D-170): the format, the size, the
; mip levels and the array size of the game's texture, of a slot nothing is bound at, of the Mod's own
; texture once the list bound it, of a slot the list unbound, and of declarations (a file, a file with a
; declared format, one that holds another by reference, one set to null, one never assigned).
namespace = judge
[Constants]
global persist $mark = 0
global persist $game_format = -9
global persist $game_width = -9
global persist $game_height = -9
global persist $game_mips = -9
global persist $game_array = -9
global persist $empty_format = -9
global persist $empty_width = -9
global persist $empty_height = -9
global persist $empty_mips = -9
global persist $empty_array = -9
global persist $mod_format = -9
global persist $mod_width = -9
global persist $mod_height = -9
global persist $mod_mips = -9
global persist $mod_array = -9
global persist $block_format = -9
global persist $typed_format = -9
global persist $null_format = -9
global persist $null_width = -9
global persist $null_mips = -9
global persist $file_format = -9
global persist $file_width = -9
global persist $file_height = -9
global persist $file_mips = -9
global persist $file_array = -9
global persist $declared_format = -9
global persist $held_format = -9
global persist $held_width = -9
global persist $held_typed = -9
global persist $held_null = -9
global persist $never_format = -9
global persist $never_width = -9
global persist $dynamic_format = -9
[ResourcePlaceC]
type = Buffer
stride = 8
filename = place_c.buf
[ResourceRed]
filename = red.dds
[ResourceWide]
filename = wide.dds
[ResourceBlock]
filename = block.dds
[ResourceTyped]
format = R8G8B8A8_UNORM_SRGB
filename = green.dds
[ResourceHeld]
[ResourceNever]
[TextureOverrideSecond]
hash = HASH_B
match_index_count = 6
$game_format = ps-t0->Format
$game_width = ps-t0->Width
$game_height = ps-t0->Height
$game_mips = ps-t0->Mips
$game_array = ps-t0->Array
$empty_format = ps-t5->Format
$empty_width = ps-t5->Width
$empty_height = ps-t5->Height
$empty_mips = ps-t5->Mips
$empty_array = ps-t5->Array
ps-t0 = ResourceWide
$mod_format = ps-t0->Format
$mod_width = ps-t0->Width
$mod_height = ps-t0->Height
$mod_mips = ps-t0->Mips
$mod_array = ps-t0->Array
local $slot = 0
$dynamic_format = ps-t[$slot]->Format
ps-t1 = ResourceBlock
$block_format = ps-t1->Format
ps-t2 = ResourceTyped
$typed_format = ps-t2->Format
ps-t0 = null
$null_format = ps-t0->Format
$null_width = ps-t0->Width
$null_mips = ps-t0->Mips
$file_format = ResourceWide->Format
$file_width = ResourceWide->Width
$file_height = ResourceWide->Height
$file_mips = ResourceWide->Mips
$file_array = ResourceWide->Array
$declared_format = ResourceTyped->Format
ResourceHeld = ref ResourceWide
$held_format = ResourceHeld->Format
$held_width = ResourceHeld->Width
ResourceHeld = ref ResourceTyped
$held_typed = ResourceHeld->Format
ResourceHeld = null
$held_null = ResourceHeld->Format
$never_format = ResourceNever->Format
$never_width = ResourceNever->Width
ps-t0 = ResourceRed
[Present]
$mark = 1
